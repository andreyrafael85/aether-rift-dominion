<!doctype html><meta charset="utf-8"><title>bustos</title><script src="../src/voxel.js"></script><script src="../src/leaders.js"></script>
<body style="background:#111"><div id="out"></div>
<script>
const V = ARD.vox || ARD.voxel; const M = () => new V.Model();
const B = ARD.leaders;
const out = document.getElementById('out'); const results = {};
for (const id of Object.keys(B)) { for (const [tag, s] of [['big', 9], ['px', 2]]) { const sp = V.renderSprite(B[id](), 0.62, s, {}); sp.canvas.id = id + '_' + tag; out.appendChild(sp.canvas); results[id + '_' + tag] = [sp.w, sp.h]; } }
window.__busts = results;
</script></body>
