<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Laboratório de efeitos</title>
<style>html,body{margin:0;background:#0e1116;overflow:hidden;font-family:system-ui,sans-serif}canvas#out{display:block}.l{position:absolute;color:#dfe6ee;font:600 12px/1.1 system-ui;text-shadow:0 1px 3px #000}</style>
<script type="importmap">{"imports":{"three":"../dist/vendor/three/build/three.module.min.js","three/addons/":"../dist/vendor/three/examples/jsm/"}}</script>
</head><body><canvas id="out"></canvas><div id="lab"></div>
<script src="../src/fx3d.js"></script>
<script type="module">
// 4.2c — laboratório dos efeitos: cada coluna é um efeito; cada linha é o mesmo instante depois do nascimento.
// O shader só depende de uTime, então dá para congelar qualquer instante e montar a folha numa imagem.
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
window.THREE = THREE;
const q = new URLSearchParams(location.search); const CW = +(q.get('cw') || 300), CH = +(q.get('ch') || 210);
const TIMES = (q.get('t') || '0.05,0.15,0.35,0.7,1.5,3').split(',').map(Number);
const COLS = [['explosão 6', f => f.explosion(0, 0, 0, 6)], ['explosão 12', f => f.explosion(0, 0, 0, 12)], ['explosão 24', f => f.explosion(0, 0, 0, 24, { wave: true })], ['impacto', f => { f.impact(0, 0, 0, 0); f.muzzle(-14, 6, 0); }], ['fumaça', f => { for (let i = 0; i < 6; i++) f.smoke(0, 4 + i * 2, 0, [0.4, 0.42, 0.46], 3, 14, 7); }], ['pulso e anel', f => { f.pulse(0, 0, 0, [0.6, 1.4, 0.8], 40); f.ring(0, 10, 0, [1.2, 0.6, 1.6], 18); f.glow(0, 6, 0, [1.4, 0.9, 0.4], 10, 1.2, 8); }]];
if (q.get('only')) { const keep = q.get('only').split(','); for (let i = COLS.length - 1; i >= 0; i--) if (!keep.includes(String(i))) COLS.splice(i, 1); }
const W = CW * COLS.length, H = CH * TIMES.length; const out = document.getElementById('out'); out.width = W; out.height = H; const octx = out.getContext('2d');
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); renderer.setSize(CW, CH); renderer.setPixelRatio(1); renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.ACESFilmicToneMapping;
const lab = document.getElementById('lab');
for (let c = 0; c < COLS.length; c++) {
  const scene = new THREE.Scene(); scene.background = new THREE.Color(0x232a33); scene.add(new THREE.HemisphereLight(0x9fb8d6, 0x2a2a30, 0.9)); const sun = new THREE.DirectionalLight(0xffe9c4, 1.8); sun.position.set(-60, 120, 80); scene.add(sun);
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(400, 400).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ color: 0x6b6d70, roughness: 0.95 })); scene.add(ground);
  const cam = new THREE.PerspectiveCamera(38, CW / CH, 1, 2000); cam.position.set(0, 55, 95); cam.lookAt(0, 10, 0); cam.updateMatrixWorld();
  const fx = ARD.fx3d.create(THREE, scene, { cap: 2048 }); COLS[c][1](fx);
  const composer = new EffectComposer(renderer); composer.addPass(new RenderPass(scene, cam)); composer.addPass(new UnrealBloomPass(new THREE.Vector2(CW, CH), 0.42, 0.5, 1.3)); composer.addPass(new OutputPass());
  for (let r = 0; r < TIMES.length; r++) { fx.update(TIMES[r], cam); composer.render(); octx.drawImage(renderer.domElement, c * CW, r * CH); }
  const el = document.createElement('div'); el.className = 'l'; el.style.left = (c * CW + 8) + 'px'; el.style.top = '6px'; el.textContent = COLS[c][0]; lab.appendChild(el);
}
for (let r = 0; r < TIMES.length; r++) { const el = document.createElement('div'); el.className = 'l'; el.style.left = '8px'; el.style.top = (r * CH + CH - 18) + 'px'; el.textContent = 't = ' + TIMES[r] + ' s'; lab.appendChild(el); }
window.__done = true;
</script></body></html>
